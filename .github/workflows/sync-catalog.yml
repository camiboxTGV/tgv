name: Catalog data sync

on:
  schedule:
    - cron: "17 3 * * 1-6" # 03:17 UTC Monday-Saturday: prices + stock only
    - cron: "17 3 * * 0" # 03:17 UTC Sunday: products + photo URLs + inventory
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync scope"
        type: choice
        options:
          - inventory
          - full
        default: inventory
      force:
        description: "Bypass the 50% deletion guard (full mode only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalog-data-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select sync mode
        id: mode
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$DISPATCH_MODE"
          elif [[ "$SCHEDULE" == "17 3 * * 0" ]]; then
            mode="full"
          else
            mode="inventory"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run ${{ steps.mode.outputs.mode }} sync
        shell: bash
        env:
          MACMA_API_BASE: ${{ secrets.MACMA_API_BASE }}
          MODE: ${{ steps.mode.outputs.mode }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--mode="$MODE")
          if [[ "$MODE" == "full" ]]; then
            args+=(--skip-images)
            if [[ "$FORCE" == "true" ]]; then
              args+=(--force)
            fi
          fi
          npm run sync:catalog -- "${args[@]}"

      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): ${MODE} sync #${{ github.run_number }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
