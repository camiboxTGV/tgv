name: Catalog data sync

on:
  push:
    branches:
      - main
    paths:
      - "suppliers/**"
      - "lib/content/catalog.ts"
      - "lib/content/catalog-colors.ts"
      - "lib/content/catalog-sync-validation.ts"
      - "scripts/sync-catalog.ts"
      - "scripts/verify-generated-catalog.ts"
  schedule:
    - cron: "17 3 * * 1-6" # 03:17 UTC Monday-Saturday: prices + stock only
    - cron: "17 3 * * 0" # 03:17 UTC Sunday: products + photo URLs + inventory
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync scope"
        type: choice
        options:
          - inventory
          - full
        default: inventory
      force:
        description: "Bypass the 50% deletion guard (full mode only)"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  # The XD feed permits one download per account every 15 minutes, regardless
  # of branch. Keep every catalog run in one global queue.
  group: catalog-data-sync-xdconnects
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select sync mode
        id: mode
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$DISPATCH_MODE"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mode="full"
          elif [[ "$SCHEDULE" == "17 3 * * 0" ]]; then
            mode="full"
          else
            mode="inventory"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Validate configuration
        shell: bash
        env:
          MACMA_API_BASE: ${{ secrets.MACMA_API_BASE }}
          MIDOCEAN_API_KEY: ${{ secrets.MIDOCEAN_API_KEY }}
          XDCONNECTS_FEED_URL: ${{ secrets.XDCONNECTS_FEED_URL }}
          CIFRA_API_TOKEN: ${{ secrets.CIFRA_API_TOKEN }}
          BLUECOLLECTION_USERNAME: ${{ secrets.BLUECOLLECTION_USERNAME }}
          BLUECOLLECTION_PASSWORD: ${{ secrets.BLUECOLLECTION_PASSWORD }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ -z "$MACMA_API_BASE" ]]; then
            echo "::error::Repository secret MACMA_API_BASE is missing."
            exit 1
          fi
          if [[ "$MACMA_API_BASE" != https://* ]]; then
            echo "::error::MACMA_API_BASE must use HTTPS."
            exit 1
          fi
          if [[ -z "$MIDOCEAN_API_KEY" ]]; then
            echo "::error::Repository secret MIDOCEAN_API_KEY is missing."
            exit 1
          fi
          if [[ -z "$XDCONNECTS_FEED_URL" ]]; then
            echo "::error::Repository secret XDCONNECTS_FEED_URL is missing."
            exit 1
          fi
          if [[ "$XDCONNECTS_FEED_URL" != https://feeds.xindao.com/Feeds/Download/* ]]; then
            echo "::error::XDCONNECTS_FEED_URL must be an XD Connects HTTPS feed URL."
            exit 1
          fi
          if [[ -z "$CIFRA_API_TOKEN" ]]; then
            echo "::error::Repository secret CIFRA_API_TOKEN is missing."
            exit 1
          fi
          if [[ -z "$BLUECOLLECTION_USERNAME" ]]; then
            echo "::error::Repository secret BLUECOLLECTION_USERNAME is missing."
            exit 1
          fi
          if [[ -z "$BLUECOLLECTION_PASSWORD" ]]; then
            echo "::error::Repository secret BLUECOLLECTION_PASSWORD is missing."
            exit 1
          fi
          if [[ "$MODE" != "inventory" && "$MODE" != "full" ]]; then
            echo "::error::Invalid sync mode: $MODE"
            exit 1
          fi

      - name: Enforce XD Connects download interval
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_epoch=0

          consider_timestamp() {
            local candidate="$1"
            if [[ -z "$candidate" ]]; then
              return
            fi

            local candidate_epoch
            candidate_epoch="$(date -d "$candidate" +%s)"
            if (( candidate_epoch > latest_epoch )); then
              latest_epoch="$candidate_epoch"
            fi
          }

          previous_updated="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-catalog.yml/runs" \
              -f status=completed \
              -f per_page=100 \
              --jq "(.workflow_runs | map(select(.id != ${GITHUB_RUN_ID} and .status == \"completed\")) | max_by(.updated_at) | .updated_at) // empty"
          )"
          consider_timestamp "$previous_updated"

          # A GitHub rerun keeps the same run id, so the query above deliberately
          # cannot see its previous attempt. Include that attempt explicitly.
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            previous_attempt="$((GITHUB_RUN_ATTEMPT - 1))"
            previous_attempt_updated="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${previous_attempt}" \
                --jq '.updated_at // empty'
            )"
            if [[ -z "$previous_attempt_updated" ]]; then
              echo "::error::Could not determine when the previous workflow attempt completed."
              exit 1
            fi
            consider_timestamp "$previous_attempt_updated"
          fi

          if (( latest_epoch == 0 )); then
            exit 0
          fi

          wait_seconds="$((latest_epoch + 900 - $(date -u +%s)))"
          if (( wait_seconds > 0 )); then
            echo "Waiting ${wait_seconds}s to respect the XD Connects download interval."
            sleep "$wait_seconds"
          fi

      - name: Run ${{ steps.mode.outputs.mode }} sync
        shell: bash
        env:
          MACMA_API_BASE: ${{ secrets.MACMA_API_BASE }}
          MIDOCEAN_API_KEY: ${{ secrets.MIDOCEAN_API_KEY }}
          XDCONNECTS_FEED_URL: ${{ secrets.XDCONNECTS_FEED_URL }}
          XDCONNECTS_RON_PER_EUR: ${{ vars.XDCONNECTS_RON_PER_EUR }}
          CIFRA_API_TOKEN: ${{ secrets.CIFRA_API_TOKEN }}
          BLUECOLLECTION_USERNAME: ${{ secrets.BLUECOLLECTION_USERNAME }}
          BLUECOLLECTION_PASSWORD: ${{ secrets.BLUECOLLECTION_PASSWORD }}
          MODE: ${{ steps.mode.outputs.mode }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--mode="$MODE")
          if [[ "$MODE" == "full" ]]; then
            args+=(--skip-images)
            if [[ "$FORCE" == "true" ]]; then
              args+=(--force)
            fi
          fi
          npm run sync:catalog -- "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/catalog-sync.log"

      - name: Verify generated catalog
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: npm run verify:catalog-sync -- --mode="$MODE"

      - name: Verify catalog app
        run: |
          npm test
          npm run build

      - name: Verify workflow change scope
        shell: bash
        run: |
          set -euo pipefail
          # Next rewrites this tracked helper differently in dev and build mode.
          # It is not catalog data and must never enter an automated sync commit.
          git restore --worktree -- next-env.d.ts

          unexpected="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u | grep -v '^lib/content/generated/' || true)"

          if [[ -n "$unexpected" ]]; then
            echo "::error::The catalog workflow changed files outside lib/content/generated/:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Detect changes
        id: diff
        run: |
          git add -A -- lib/content/generated
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify branch has not changed
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "::error::The branch changed while catalog data was being generated. Rerun the workflow so data is produced and tested against the latest code."
            exit 1
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): ${MODE} sync #${{ github.run_number }}"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          {
            echo "## Catalog data sync"
            echo "- Mode: \`$MODE\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Generated data changed: \`${CHANGED:-unknown}\`"
            if [[ -f "$RUNNER_TEMP/catalog-sync.log" ]]; then
              echo
              echo "<details><summary>Sync output</summary>"
              echo
              echo '```text'
              sed -n '1,160p' "$RUNNER_TEMP/catalog-sync.log"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-sync-${{ github.run_number }}-${{ steps.mode.outputs.mode }}
          path: |
            ${{ runner.temp }}/catalog-sync.log
            lib/content/generated/sync-report.json
            lib/content/generated/last-sync.json
          if-no-files-found: warn
          retention-days: 14
